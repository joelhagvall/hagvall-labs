name: hagvall-labs

services:
  web:
    image: ${HAGVALL_LABS_IMAGE:-hagvall-labs:local}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.5
    tmpfs:
      - /tmp:size=32m,mode=1777
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/bun
        - -e
        - "const response = await fetch('http://127.0.0.1:4173/'); process.exit(response.ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      edge:
        aliases: [hagvall-labs]

  # On-demand Lighthouse and pa11y runner for the VPS. It is excluded from
  # normal compose operations unless the audit profile is explicitly enabled.
  audit:
    profiles: [audit]
    image: hagvall-labs-audit:local
    build:
      context: .
      dockerfile: Dockerfile.audit
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    shm_size: 1gb
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /home/pptruser/.config:size=64m,uid=10042,gid=999,mode=700
      - /home/pptruser/.local:size=64m,uid=10042,gid=999,mode=700
      - /home/pptruser/.cache/fontconfig:size=32m,uid=10042,gid=999,mode=700
    environment:
      BASE: http://hagvall-labs:4173
      CHROME_PATH: /usr/local/bin/chrome
      PUPPETEER_EXECUTABLE_PATH: /usr/local/bin/chrome
      CHROME_FLAGS: --headless=new --no-sandbox --disable-dev-shm-usage
      PA11Y_CONFIG: /usr/local/lib/hagvall-labs/pa11y-container.json
    depends_on:
      web:
        condition: service_healthy
    networks: [edge]

networks:
  edge:
    external: true
    name: maskera-cloud_edge
