name: hagvall-labs

x-umami-image: &umami-image ghcr.io/umami-software/umami:3.2.0@sha256:8edfe4beaef13f9d1300619fa264ef250a3688df9cc54d24ca830ca31cb475ec

services:
  web:
    image: ${HAGVALL_LABS_IMAGE:-hagvall-labs:local}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.5
    tmpfs:
      - /tmp:size=32m,mode=1777
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/bun
        - -e
        - "const response = await fetch('http://127.0.0.1:4173/'); process.exit(response.ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      edge:
        aliases: [hagvall-labs]

  umami:
    image: *umami-image
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 768m
    cpus: 0.75
    tmpfs:
      - /tmp:size=64m,uid=1001,gid=1001,mode=1777
      - /app/.next/cache:size=64m,uid=1001,gid=1001,mode=700
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD in .env}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET in .env}
      CLIENT_IP_HEADER: X-Forwarded-For
      DISABLE_TELEMETRY: "1"
      PRIVATE_MODE: "1"
    depends_on:
      umami-db:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:3000/api/heartbeat >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      analytics: null
      edge:
        aliases: [umami]

  umami-db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.5
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD in .env}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [analytics]

  umami-bootstrap:
    profiles: [bootstrap]
    image: *umami-image
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.25
    entrypoint: ["node", "/bootstrap/bootstrap-umami.mjs"]
    environment:
      UMAMI_INTERNAL_URL: http://umami:3000
      UMAMI_ADMIN_PASSWORD: ${UMAMI_ADMIN_PASSWORD:?set UMAMI_ADMIN_PASSWORD in .env}
      UMAMI_WEBSITE_ID: 4f1d3158-8b29-4380-9852-e6ba8069c881
    volumes:
      - ./scripts/bootstrap-umami.mjs:/bootstrap/bootstrap-umami.mjs:ro
    depends_on:
      umami:
        condition: service_healthy
    networks: [analytics]

  # On-demand Lighthouse and pa11y runner for the VPS. It is excluded from
  # normal compose operations unless the audit profile is explicitly enabled.
  audit:
    profiles: [audit]
    image: hagvall-labs-audit:local
    build:
      context: .
      dockerfile: Dockerfile.audit
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    shm_size: 1gb
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /home/pptruser/.config:size=64m,uid=10042,gid=999,mode=700
      - /home/pptruser/.local:size=64m,uid=10042,gid=999,mode=700
      - /home/pptruser/.cache/fontconfig:size=32m,uid=10042,gid=999,mode=700
    environment:
      BASE: http://hagvall-labs:4173
      CHROME_PATH: /usr/local/bin/chrome
      PUPPETEER_EXECUTABLE_PATH: /usr/local/bin/chrome
      CHROME_FLAGS: --headless=new --no-sandbox --disable-dev-shm-usage
      PA11Y_CONFIG: /usr/local/lib/hagvall-labs/pa11y-container.json
    depends_on:
      web:
        condition: service_healthy
    networks: [edge]

networks:
  edge:
    external: true
    name: maskera-cloud_edge
  analytics:
    internal: true

volumes:
  umami-db-data:
