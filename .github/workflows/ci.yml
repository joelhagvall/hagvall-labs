# CI for hagvall-labs.com: typecheck + build, then the quality gates from
# AGENTS.md (Lighthouse Performance >= 95, SEO/Accessibility 100 and pa11y
# 0 errors on every route), sharded one route per job against the production
# Worker running locally in workerd (`bun run serve:prod`), and a dependency
# audit. The route matrix below must match the route list in scripts/audit.sh.
# The Deploy workflow only deploys a commit whose CI run passed.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  # The Lighthouse workflow dispatches this after committing new scores: a
  # push made with GITHUB_TOKEN never triggers CI, so without it that commit
  # would have no green CI run and could not be deployed.
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Deploy this commit once CI has passed (only if it is the commit CI ran on)
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup

      - name: No em-dashes in copy or code
        run: |
          if grep -rn -- '—' src public; then
            echo 'Em-dashes are forbidden (see AGENTS.md), rewrite with comma, colon or period.'
            exit 1
          fi

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Build
        run: bun run build

      - name: Agent-readiness checks (markdown negotiation, 404s, aliases)
        run: |
          bun run serve:prod &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          bash scripts/agent-checks.sh

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 3

  audit:
    name: Audit ${{ matrix.route }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        route: [home, maskera, kontakt, integritet, om, en, enmaskera, encontact, enprivacy, enabout]
    env:
      # Use the runner's preinstalled Chrome for both Lighthouse (chrome-launcher)
      # and pa11y (puppeteer), instead of downloading a browser per job.
      CHROME_PATH: /usr/bin/google-chrome
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      # Use the median of three runs to absorb shared-runner variance. Retry
      # Chrome transport failures without weakening any score threshold.
      LH_RUNS: '3'
      LH_MAX_ATTEMPTS: '3'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Start the production Worker locally
        run: |
          bun run serve:prod &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:4173/ >/dev/null && exit 0
            sleep 1
          done
          echo 'prod server never became ready'
          exit 1

      - name: Lighthouse + pa11y
        run: bash scripts/audit.sh ${{ matrix.route }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup

      # Fails on any high or critical advisory in the lockfile, shipped or not.
      - name: bun audit
        run: bun audit --audit-level=high

  # Only for the score commit from the Lighthouse workflow, which has already
  # checked that the scores file is its whole difference to the live release.
  deploy:
    name: Deploy the score commit
    needs: [build, audit, dependencies]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_sha == github.sha
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch Deploy for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref master \
            -f release_sha="$GITHUB_SHA"
