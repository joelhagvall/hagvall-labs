# CI for hagvall-labs.com: typecheck + build, then the quality gates from
# AGENTS.md (Lighthouse Performance >= 95, SEO/Accessibility 100 and pa11y
# 0 errors on every route),
# sharded one route per job against the gzip prod server.
# The route matrix below must match the route list in scripts/audit.sh.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup

      - name: No em-dashes in copy or code
        run: |
          if grep -rn -- '—' src public; then
            echo 'Em-dashes are forbidden (see AGENTS.md), rewrite with comma, colon or period.'
            exit 1
          fi

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Build
        run: bun run build

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 3

  audit:
    name: Audit ${{ matrix.route }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        route: [home, maskera, kontakt, integritet, en, enmaskera, encontact, enprivacy]
    env:
      # Use the runner's preinstalled Chrome for both Lighthouse (chrome-launcher)
      # and pa11y (puppeteer), instead of downloading a browser per job.
      CHROME_PATH: /usr/bin/google-chrome
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      # Use the median of three runs to absorb shared-runner variance. Retry
      # Chrome transport failures without weakening any score threshold.
      LH_RUNS: '3'
      LH_MAX_ATTEMPTS: '3'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/setup

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Start prod server (gzip)
        run: |
          bun run serve:prod &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && exit 0
            sleep 1
          done
          echo 'prod server never became ready'
          exit 1

      - name: Lighthouse + pa11y
        run: bash scripts/audit.sh ${{ matrix.route }}

  docker:
    name: Build, scan and publish image
    needs: [build, audit]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/joelhagvall/hagvall-labs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build immutable production image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/joelhagvall/hagvall-labs" \
            -t "$IMAGE:$GITHUB_SHA" \
            .

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/joelhagvall/hagvall-labs:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH,CRITICAL
          version: v0.70.0

      - name: Log in to GHCR
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish commit-tagged image
        run: docker push "$IMAGE:$GITHUB_SHA"
