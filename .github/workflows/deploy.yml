name: Deploy
# The Lighthouse workflow reads the release SHA from this title to know what
# is live (workflow_run.display_title): keep the format.
run-name: Deploy ${{ inputs.release_sha || github.sha }}

# Manual production deploy to Cloudflare Workers (wrangler.jsonc). It only
# deploys a master commit whose CI run passed (typecheck, build, Lighthouse,
# pa11y, agent checks and the dependency audit), built the same way CI built
# it plus the Cloudflare Web Analytics token.
# The one automatic deploy: CI dispatches this for a Lighthouse score commit
# whose only difference to the live release is src/lighthouse-scores.json.
# Requires the CLOUDFLARE_API_TOKEN secret ("Edit Cloudflare Workers") and
# the CF_BEACON_TOKEN repository variable.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Optional full commit SHA from master; defaults to the selected workflow revision
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: hagvall-labs-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - id: release
        name: Resolve immutable release
        env:
          RELEASE_SHA_INPUT: ${{ inputs.release_sha }}
        run: |
          release_sha="${RELEASE_SHA_INPUT:-$GITHUB_SHA}"
          if ! [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full lowercase Git commit SHA" >&2
            exit 1
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # A score commit's Deploy is dispatched by the last job of its own CI
      # run, so give that run a moment to finish before giving up.
      - name: Require a master commit with a passed CI run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          git merge-base --is-ancestor "$RELEASE_SHA" origin/master
          for _ in $(seq 1 30); do
            passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$RELEASE_SHA" --status success --json databaseId --jq length)
            [ "$passed" -gt 0 ] && exit 0
            sleep 10
          done
          echo "CI has not passed for $RELEASE_SHA" >&2
          exit 1

      - uses: ./.github/actions/setup

      - name: Build
        env:
          VITE_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
        run: |
          test -n "$VITE_CF_BEACON_TOKEN"
          bun run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          WRANGLER_SEND_METRICS: 'false'
        run: bun x wrangler deploy --message "Deploy $RELEASE_SHA"

      # Search engines hear about the new release right away instead of on
      # their next crawl. Never fails the deploy: the release is already live.
      - name: Notify IndexNow
        continue-on-error: true
        run: bash scripts/indexnow.sh https://hagvall-labs.com
